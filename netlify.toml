[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "ejs", "serverless-http"]
  included_files = ["views/**", "lib/**", "data/**", "app.js", "projects-details.html", "index.html", "portfolio.html"]

# Portfolio is static (no Blobs). Details page uses function + JSON.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/portfolio.html"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/portfolio.html"
  status = 302
  force = true

[[redirects]]
  from = "/projects-details.html"
  to = "/.netlify/functions/server/projects-details.html"
  status = 200
  force = true
